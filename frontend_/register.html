<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 志愿服务管理系统</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card wide">
            <div class="logo">志</div>
            <h1>志愿者注册</h1>
            <p class="subtitle">加入我们，开启您的志愿服务之旅</p>

            <form id="registerForm" onsubmit="return handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">用户名 <span class="required">*</span></label>
                        <input class="form-input" type="text" id="username" placeholder="至少3个字符" required>
                        <div class="form-error" id="usernameError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">真实姓名 <span class="required">*</span></label>
                        <input class="form-input" type="text" id="realName" placeholder="请输入真实姓名" required>
                        <div class="form-error" id="realNameError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">密码 <span class="required">*</span></label>
                        <input class="form-input" type="password" id="password" placeholder="至少6个字符" required>
                        <div class="form-error" id="passwordError"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码 <span class="required">*</span></label>
                        <input class="form-input" type="password" id="confirmPassword" placeholder="再次输入密码" required>
                        <div class="form-error" id="confirmPasswordError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input class="form-input" type="email" id="email" placeholder="example@email.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input class="form-input" type="tel" id="phone" placeholder="13800138000">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">学号</label>
                    <input class="form-input" type="text" id="studentId" placeholder="请输入学号（选填）">
                </div>

                <div class="form-group">
                    <label class="form-label">擅长领域（可选）</label>
                    <div class="tag-group" id="tagGroup">
                        <span class="tag-chip" data-tag="教育辅导">教育辅导</span>
                        <span class="tag-chip" data-tag="环境保护">环境保护</span>
                        <span class="tag-chip" data-tag="医疗救护">医疗救护</span>
                        <span class="tag-chip" data-tag="敬老助残">敬老助残</span>
                        <span class="tag-chip" data-tag="文化宣传">文化宣传</span>
                        <span class="tag-chip" data-tag="应急救援">应急救援</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="registerBtn" style="margin-top:8px">
                    ⚇ 注册
                </button>
            </form>

            <p style="margin-top:20px; font-size:13px; color:var(--text-secondary)">
                已有账号？ <a href="login.html">立即登录</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 已登录则跳转
        if (isLoggedIn()) {
            window.location.href = 'activity-list.html';
        }

        // 标签选择
        document.getElementById('tagGroup').addEventListener('click', (e) => {
            const chip = e.target.closest('.tag-chip');
            if (chip) chip.classList.toggle('selected');
        });

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const realName = document.getElementById('realName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const studentId = document.getElementById('studentId').value.trim();

            // 前端校验
            let valid = true;
            clearAllErrors();

            if (username.length < 3 || username.length > 50) {
                showFieldError('username', '用户名需3-50个字符'); valid = false;
            }
            if (!realName) {
                showFieldError('realName', '请输入真实姓名'); valid = false;
            }
            if (password.length < 6 || password.length > 50) {
                showFieldError('password', '密码需6-50个字符'); valid = false;
            }
            if (password !== confirmPassword) {
                showFieldError('confirmPassword', '两次密码不一致'); valid = false;
            }
            if (!valid) return;

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                const body = { username, password, realName };
                if (email) body.email = email;
                if (phone) body.phone = phone;
                if (studentId) body.studentId = studentId;

                await post('/api/auth/register', body);
                showToast('注册成功，请登录', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1000);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = '⚇ 注册';
            }
        }

        function showFieldError(field, msg) {
            const el = document.getElementById(field);
            if (!el) return;
            const group = el.closest('.form-group');
            group.classList.add('has-error');
            const errEl = group.querySelector('.form-error');
            if (errEl) errEl.textContent = msg;
        }
        function clearAllErrors() {
            document.querySelectorAll('.form-group.has-error').forEach(g => g.classList.remove('has-error'));
        }
    </script>
</body>
</html>
