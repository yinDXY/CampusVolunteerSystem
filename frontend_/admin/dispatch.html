<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能派岗 - 志愿服务管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }

        /* 选择栏 */
        .select-bar {
            background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            padding: 20px 24px; margin-bottom: 20px;
            display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end;
        }
        .select-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 220px; }
        .select-group label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .select-group label .required { color: var(--danger); }
        .cascade-select {
            padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; color: var(--text-primary); background: #fff; cursor: pointer;
            outline: none; width: 100%; transition: border-color .15s;
        }
        .cascade-select:focus { border-color: var(--primary); }
        .cascade-select:disabled { background: #f3f4f6; cursor: not-allowed; color: var(--text-secondary); }

        /* 岗位信息卡 */
        .position-info-card {
            background: var(--primary-light); border: 1px solid #c7d9f8; border-radius: var(--radius-md);
            padding: 16px 20px; margin-bottom: 20px;
            font-size: 13px; color: var(--text-secondary);
        }
        .position-info-card .info-row { margin-bottom: 6px; }
        .position-info-card .info-row:last-child { margin-bottom: 0; }
        .position-info-card strong { color: var(--text-primary); }

        /* 候选人列表 */
        .candidates-header {
            font-size: 18px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 4px;
        }
        .candidates-sub {
            font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;
        }

        .candidate-card {
            background: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            padding: 20px 24px; margin-bottom: 14px;
            display: flex; align-items: center; gap: 20px;
            transition: border-color .15s, box-shadow .15s;
        }
        .candidate-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
        .candidate-card.assigned { opacity: .55; }

        /* 头像 */
        .candidate-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
        }

        /* 信息区 */
        .candidate-info { flex: 1; min-width: 0; }
        .candidate-name { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .candidate-hours { font-size: 12px; color: var(--text-secondary); }

        /* 三列指标 */
        .candidate-metrics {
            display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap;
        }
        .metric-group { display: flex; flex-direction: column; gap: 4px; min-width: 100px; }
        .metric-label { font-size: 11px; color: var(--text-muted); }
        .match-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .match-bar { width: 100px; height: 6px; background: #e9ecef; border-radius: 3px; overflow: hidden; }
        .match-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; }
        .match-pct { font-size: 13px; font-weight: 600; color: var(--primary); }

        .skill-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .skill-tag {
            background: var(--primary-light); color: var(--primary); font-size: 11px; padding: 2px 8px;
            border-radius: 10px; font-weight: 500;
        }

        .avail-badge {
            font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
        }
        .avail-yes  { background: var(--success-bg); color: var(--success); }
        .avail-part { background: var(--warning-bg); color: #d97706; }
        .avail-no   { background: var(--danger-bg); color: var(--danger); }

        /* 派岗按钮 */
        .btn-assign {
            background: var(--primary); color: #fff; border: none;
            padding: 10px 20px; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
            transition: background .15s, opacity .15s;
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .btn-assign:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-assign:disabled { background: #9ca3af; cursor: not-allowed; }

        .btn-cancel-assign {
            background: var(--danger-bg); color: var(--danger); border: none;
            padding: 10px 20px; border-radius: 8px; font-size: 14px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
            transition: background .15s;
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .btn-cancel-assign:hover { background: #fecaca; }

        /* 空状态 */
        .empty-state {
            text-align: center; padding: 80px 0; color: var(--text-secondary);
            font-size: 14px;
        }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* 头像颜色组 */
        .av-0 { background: linear-gradient(135deg, #667eea, #764ba2); }
        .av-1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .av-2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .av-3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .av-4 { background: linear-gradient(135deg, #fa709a, #fee140); }
        .av-5 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
    </style>
</head>
<body>

<div class="admin-body">
    <div class="page-title">智能派岗</div>
    <div class="page-subtitle">根据志愿者能力和活动需求，智能推荐合适人选</div>

        <!-- 级联选择 -->
        <div class="select-bar">
            <div class="select-group">
                <label><span class="required">* </span>选择活动</label>
                <select class="cascade-select" id="activitySel">
                    <option value="">请选择活动</option>
                </select>
            </div>
            <div class="select-group">
                <label><span class="required">* </span>选择岗位</label>
                <select class="cascade-select" id="positionSel" disabled>
                    <option value="">请选择岗位</option>
                </select>
            </div>
        </div>

        <!-- 岗位信息（选中岗位后显示） -->
        <div class="position-info-card" id="posInfoCard" style="display:none">
            <div class="info-row">岗位描述：<strong id="posDesc">—</strong></div>
            <div class="info-row">岗位要求：<strong id="posReqs">—</strong></div>
            <div class="info-row">剩余名额：<strong id="posRemain" style="color:var(--primary)">—</strong> 个</div>
        </div>

        <!-- 候选人列表 -->
        <div id="candidatesWrap">
            <div class="empty-state">
                <div class="empty-icon">👥</div>
                <div>请先选择活动和岗位</div>
                <div style="margin-top:4px;font-size:12px">系统将为您推荐最合适的志愿者</div>
            </div>
        </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    requireAuth(1);
    renderNavbar('admin');
    renderSidebar('dispatch');

    let currentPositionData = null;

    // ─── 加载活动列表 ───
    async function loadActivities() {
        try {
            const data = await get('/api/activities', { pageNum: 1, pageSize: 100 });
            const sel = document.getElementById('activitySel');
            (data.list || []).forEach(a => {
                const opt = document.createElement('option');
                opt.value = a.id;
                opt.textContent = a.title;
                sel.appendChild(opt);
            });
        } catch (e) {}
    }

    // ─── 活动选择：加载岗位 ───
    document.getElementById('activitySel').addEventListener('change', async function () {
        const actId = this.value;
        const posSel = document.getElementById('positionSel');
        posSel.innerHTML = '<option value="">请选择岗位</option>';
        posSel.disabled = !actId;
        hidePositionInfo();
        showEmptyState('请选择岗位');

        if (!actId) return;
        try {
            const positions = await get(`/api/activities/${actId}/positions`);
            (positions || []).forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} (${p.assignedCount ?? 0}/${p.quota})`;
                opt.dataset.desc    = p.description || '';
                opt.dataset.reqs    = p.requirements || '';
                opt.dataset.quota   = p.quota || 0;
                opt.dataset.assigned = p.assignedCount ?? 0;
                posSel.appendChild(opt);
            });
        } catch (e) {}
    });

    // ─── 岗位选择：加载推荐 ───
    document.getElementById('positionSel').addEventListener('change', function () {
        const posId = this.value;
        if (!posId) {
            hidePositionInfo();
            showEmptyState('请选择岗位');
            return;
        }
        const opt = this.options[this.selectedIndex];
        const quota    = Number(opt.dataset.quota)    || 0;
        const assigned = Number(opt.dataset.assigned) || 0;
        const remain   = Math.max(0, quota - assigned);

        // 显示岗位信息
        document.getElementById('posInfoCard').style.display = '';
        document.getElementById('posDesc').textContent   = opt.dataset.desc  || '—';
        document.getElementById('posReqs').textContent   = opt.dataset.reqs  || '—';
        document.getElementById('posRemain').textContent = remain;
        currentPositionData = { id: Number(posId), remain };

        loadCandidates(posId, remain);
    });

    function hidePositionInfo() {
        document.getElementById('posInfoCard').style.display = 'none';
        currentPositionData = null;
    }

    async function loadCandidates(positionId, remain) {
        const wrap = document.getElementById('candidatesWrap');
        wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div>推荐中...</div></div>';
        try {
            const data = await get(`/api/dispatch/recommend/${positionId}`);
            renderCandidates(data.candidates || [], remain);
        } catch (e) {
            wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div>加载推荐列表失败</div></div>';
        }
    }

    function renderCandidates(list, remain) {
        const wrap = document.getElementById('candidatesWrap');
        if (list.length === 0) {
            wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>暂无符合条件的志愿者</div><div style="margin-top:4px;font-size:12px">可能暂无通过审核且未被派岗的报名者</div></div>';
            return;
        }

        const maxScore = list[0]?.matchScore || 1;

        wrap.innerHTML = `
            <div class="candidates-header">智能推荐志愿者</div>
            <div class="candidates-sub">按匹配度排序</div>
            <div id="candidateList">
                ${list.map((c, i) => renderCandidateCard(c, i, remain, maxScore)).join('')}
            </div>
        `;
    }

    function renderCandidateCard(c, i, remain, maxScore) {
        const avColor = `av-${i % 6}`;
        const firstName = (c.volunteerName || c.realName || '?').charAt(0);

        // 匹配度（以最高分为基准百分比）
        const pct = maxScore > 0 ? Math.round(c.matchScore / (maxScore + 1) * 95 + 5) : 50;

        // 技能标签
        const skillHtml = (c.volunteerTags || c.skills || '')
            ? (c.volunteerTags || c.skills).split(',').filter(Boolean)
                .map(s => `<span class="skill-tag">${escapeHtml(s.trim())}</span>`).join('')
            : '<span style="color:var(--text-secondary);font-size:12px">—</span>';

        // 可用性（这里用 qualified 字段或全匹配判断）
        const isQualified = c.qualified || c.requiredCount === 0 || (c.matchedCount >= c.requiredCount);
        let availHtml;
        if (isQualified) {
            availHtml = '<span class="avail-badge avail-yes">可用</span>';
        } else if (c.matchedCount > 0) {
            availHtml = '<span class="avail-badge avail-part">部分可用</span>';
        } else {
            availHtml = '<span class="avail-badge avail-no">不匹配</span>';
        }

        const isAssigned = c.registrationStatus === 3; // 已被派岗
        const btnHtml = isAssigned
            ? `<button class="btn-cancel-assign" onclick="cancelAssign(${c.registrationId})">✕ 取消派岗</button>`
            : `<button class="btn-assign" ${remain <= 0 ? 'disabled' : ''} onclick="assign(${c.registrationId}, '${escapeHtml(c.volunteerName || c.realName || '')}')">
                <span>👤＋</span> 派岗
               </button>`;

        return `<div class="candidate-card ${isAssigned ? 'assigned' : ''}" id="card-${c.registrationId}">
            <div class="candidate-avatar ${avColor}">${escapeHtml(firstName)}</div>
            <div class="candidate-info">
                <div class="candidate-name">${escapeHtml(c.volunteerName || c.realName || '—')}</div>
                <div class="candidate-hours">🕐 服务时长：${c.totalHours ?? 0} 小时</div>
            </div>
            <div class="candidate-metrics">
                <div class="metric-group">
                    <span class="metric-label">匹配度</span>
                    <div class="match-bar-wrap">
                        <div class="match-bar"><div class="match-bar-fill" style="width:${pct}%"></div></div>
                        <span class="match-pct">${pct}%</span>
                    </div>
                </div>
                <div class="metric-group">
                    <span class="metric-label">擅长技能</span>
                    <div class="skill-tags">${skillHtml}</div>
                </div>
                <div class="metric-group">
                    <span class="metric-label">可用性</span>
                    ${availHtml}
                </div>
            </div>
            ${btnHtml}
        </div>`;
    }

    async function assign(regId, name) {
        if (!currentPositionData) return;
        if (currentPositionData.remain <= 0) {
            showToast('该岗位名额已满', 'error');
            return;
        }
        const ok = await showConfirm('确认派岗', `确定将「${name}」派到此岗位？`);
        if (!ok) return;
        try {
            await post('/api/dispatch/assign', {
                registrationId: regId,
                positionId: currentPositionData.id,
            });
            showToast('派岗成功', 'success');
            // 更新剩余名额并重新加载
            currentPositionData.remain--;
            document.getElementById('posRemain').textContent = currentPositionData.remain;
            loadCandidates(currentPositionData.id, currentPositionData.remain);
        } catch (e) {}
    }

    async function cancelAssign(regId) {
        const ok = await showConfirm('取消派岗', '确定取消该志愿者的派岗？');
        if (!ok) return;
        try {
            await del(`/api/dispatch/assign/${regId}`);
            showToast('已取消派岗', 'success');
            currentPositionData.remain++;
            document.getElementById('posRemain').textContent = currentPositionData.remain;
            loadCandidates(currentPositionData.id, currentPositionData.remain);
        } catch (e) {}
    }

    function showEmptyState(msg) {
        document.getElementById('candidatesWrap').innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">👥</div>
                <div>${escapeHtml(msg)}</div>
                <div style="margin-top:4px;font-size:12px">系统将为您推荐最合适的志愿者</div>
            </div>`;
    }

    loadActivities();
</script>
</body>
</html>
