<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 志愿服务管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); }
        .year-select {
            padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; color: var(--text-primary); background: #fff; cursor: pointer; outline: none;
        }
        .year-select:focus { border-color: var(--primary); }

        /* 统计卡片 */
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        @media (max-width: 900px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
        .summary-card {
            background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            padding: 20px 24px;
        }
        .summary-card .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .summary-card .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .summary-card .card-icon svg { width: 22px; height: 22px; }
        .summary-card .card-icon.blue   { background: #dbeafe; }
        .summary-card .card-icon.blue svg   { color: #2563eb; }
        .summary-card .card-icon.green  { background: #dcfce7; }
        .summary-card .card-icon.green svg  { color: #16a34a; }
        .summary-card .card-icon.purple { background: #f3e8ff; }
        .summary-card .card-icon.purple svg { color: #9333ea; }
        .summary-card .card-icon.yellow { background: #fef9c3; }
        .summary-card .card-icon.yellow svg { color: #ca8a04; }
        .summary-card .trend-icon svg { width: 20px; height: 20px; color: #16a34a; }
        .summary-card .card-value { font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 2px; }
        .summary-card .card-label { font-size: 13px; color: var(--text-secondary); }

        /* 两栏区域 */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

        .panel {
            background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 24px;
        }
        .panel h2 { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 20px; }

        /* 排行榜 */
        .lb-list { display: flex; flex-direction: column; gap: 8px; }
        .lb-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: #f8fafc; border-radius: 10px;
            transition: background .15s;
        }
        .lb-item:hover { background: #f1f5f9; }
        .lb-left { display: flex; align-items: center; gap: 14px; }
        .lb-rank {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; flex-shrink: 0;
            background: #e0e7ff; color: var(--primary);
        }
        .lb-item:nth-child(1) .lb-rank { background: #fef9c3; color: #b45309; }
        .lb-item:nth-child(2) .lb-rank { background: #f1f5f9; color: #475569; }
        .lb-item:nth-child(3) .lb-rank { background: #ffedd5; color: #c2410c; }
        .lb-name { font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .lb-sub  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
        .lb-right { text-align: right; }
        .lb-hours { font-size: 17px; font-weight: 700; color: var(--text-primary); }
        .lb-unit  { font-size: 12px; color: var(--text-muted); }

        /* 图表容器 */
        .chart-box { width: 100%; height: 380px; }

        .panel-empty { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>
<div id="navbar"></div>
<div id="sidebar"></div>

<div class="admin-body">
    <!-- 页头 -->
    <div class="page-header">
        <div>
            <h1 class="page-title">数据统计</h1>
            <p class="page-subtitle">查看志愿服务数据分析和趋势</p>
        </div>
        <select id="yearSelect" class="year-select" onchange="onYearChange()"></select>
    </div>

    <!-- 四大统计卡片 -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="card-top">
                <div class="card-icon blue">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <div class="trend-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
            </div>
            <div class="card-value" id="totalActivities">-</div>
            <div class="card-label">总活动数</div>
        </div>
        <div class="summary-card">
            <div class="card-top">
                <div class="card-icon green">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="trend-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
            </div>
            <div class="card-value" id="totalVolunteers">-</div>
            <div class="card-label">参与志愿者</div>
        </div>
        <div class="summary-card">
            <div class="card-top">
                <div class="card-icon purple">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <div class="trend-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
            </div>
            <div class="card-value" id="totalHours">-</div>
            <div class="card-label">累计服务时长</div>
        </div>
        <div class="summary-card">
            <div class="card-top">
                <div class="card-icon yellow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
                </div>
                <div class="trend-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
            </div>
            <div class="card-value" id="avgScore">-</div>
            <div class="card-label">签到完成率</div>
        </div>
    </div>

    <!-- 两栏：排行榜 + 活动热度 -->
    <div class="two-col">
        <div class="panel">
            <h2>志愿者时长排行榜</h2>
            <div id="leaderboardList" class="lb-list"></div>
            <div id="lbEmpty" class="panel-empty" style="display:none;">暂无排行数据</div>
        </div>
        <div class="panel">
            <h2>活动热度统计</h2>
            <div id="heatChart" class="chart-box"></div>
        </div>
    </div>

    <!-- 全宽：月度趋势 -->
    <div class="panel">
        <h2>月度参与趋势</h2>
        <div id="trendChart" class="chart-box"></div>
    </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    requireAuth(1);
    renderNavbar('admin');
    renderSidebar('stats');

    let heatChartInstance = null;
    let trendChartInstance = null;

    /* =========== 年份选择器 =========== */
    (function initYearSelect() {
        const sel = document.getElementById('yearSelect');
        const curYear = new Date().getFullYear();
        for (let y = curYear; y >= curYear - 5; y--) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y + '年';
            sel.appendChild(opt);
        }
        sel.value = curYear;
    })();

    function onYearChange() {
        loadTrend();
    }

    /* =========== 初始化加载 =========== */
    (async function init() {
        await Promise.all([
            loadLeaderboard(),
            loadHeat(),
            loadTrend()
        ]);
    })();

    /* =========== 排行榜 =========== */
    async function loadLeaderboard() {
        try {
            const list = await get('/api/stats/leaderboard') || [];
            renderLeaderboard(list);
            // 用排行榜数据计算汇总卡片的参与志愿者和累计时长
            if (list.length) {
                const totalVol = list.length;
                const totalH = list.reduce((s, v) => s + (v.totalHours || 0), 0);
                document.getElementById('totalVolunteers').textContent = totalVol;
                document.getElementById('totalHours').textContent = totalH;
            }
        } catch (e) {
            document.getElementById('lbEmpty').style.display = '';
        }
    }

    function renderLeaderboard(list) {
        const container = document.getElementById('leaderboardList');
        const empty = document.getElementById('lbEmpty');
        if (!list.length) { empty.style.display = ''; container.innerHTML = ''; return; }
        empty.style.display = 'none';

        container.innerHTML = list.slice(0, 10).map((v, i) => {
            const rank = v.rankNo || (i + 1);
            const name = escapeHtml(v.realName || '-');
            const hours = v.totalHours != null ? v.totalHours : 0;
            const acts = v.activityCount || 0;
            return `<div class="lb-item">
                <div class="lb-left">
                    <div class="lb-rank">${rank}</div>
                    <div>
                        <div class="lb-name">${name}</div>
                        <div class="lb-sub">参与 ${acts} 次活动</div>
                    </div>
                </div>
                <div class="lb-right">
                    <div class="lb-hours">${hours}</div>
                    <div class="lb-unit">小时</div>
                </div>
            </div>`;
        }).join('');
    }

    /* =========== 活动热度柱状图 =========== */
    async function loadHeat() {
        try {
            const list = await get('/api/stats/activity-heat') || [];
            renderHeatChart(list);
            // 用热度数据补充汇总卡片
            if (list.length) {
                document.getElementById('totalActivities').textContent = list.length;
                // 用签到完成率作为综合评分指标
                const totalSigned = list.reduce((s, a) => s + (a.signedCount || 0), 0);
                const totalCheckin = list.reduce((s, a) => s + (a.checkinCount || 0), 0);
                if (totalSigned > 0) {
                    const rate = (totalCheckin / totalSigned * 100).toFixed(1);
                    document.getElementById('avgScore').textContent = rate + '%';
                } else {
                    document.getElementById('avgScore').textContent = '-';
                }
            }
        } catch (e) {
            console.error('加载活动热度失败', e);
        }
    }

    function renderHeatChart(list) {
        if (!list.length) return;
        const dom = document.getElementById('heatChart');
        heatChartInstance = echarts.init(dom);

        // 取前 10 个活动（按 checkinCount 降序）
        const top = list.slice(0, 10);
        const titles = top.map(a => {
            const t = a.title || '';
            return t.length > 6 ? t.slice(0, 6) + '…' : t;
        });

        heatChartInstance.setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                backgroundColor: '#fff',
                borderColor: '#e5e7eb',
                borderRadius: 8,
                textStyle: { color: '#374151', fontSize: 13 }
            },
            legend: {
                bottom: 0,
                textStyle: { color: '#6b7280', fontSize: 12 }
            },
            grid: { left: 40, right: 20, top: 16, bottom: 50, containLabel: true },
            xAxis: {
                type: 'category',
                data: titles,
                axisLabel: { fontSize: 11, color: '#6b7280', rotate: 20 },
                axisLine: { lineStyle: { color: '#e5e7eb' } }
            },
            yAxis: {
                type: 'value',
                axisLabel: { fontSize: 12, color: '#6b7280' },
                splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } }
            },
            series: [
                {
                    name: '活动数量',
                    type: 'bar',
                    data: top.map(a => a.checkinCount || 0),
                    itemStyle: { color: '#3b82f6', borderRadius: [4, 4, 0, 0] },
                    barMaxWidth: 32
                },
                {
                    name: '参与人数',
                    type: 'bar',
                    data: top.map(a => a.signedCount || 0),
                    itemStyle: { color: '#8b5cf6', borderRadius: [4, 4, 0, 0] },
                    barMaxWidth: 32
                }
            ]
        });
    }

    /* =========== 月度趋势折线图 =========== */
    async function loadTrend() {
        const year = document.getElementById('yearSelect').value;
        try {
            const list = await get(`/api/stats/trend?year=${year}`) || [];
            renderTrendChart(list);
        } catch (e) {
            console.error('加载月度趋势失败', e);
        }
    }

    function renderTrendChart(rawList) {
        const dom = document.getElementById('trendChart');
        trendChartInstance = trendChartInstance || echarts.init(dom);

        // 补齐12个月
        const monthData = Array.from({ length: 12 }, (_, i) => {
            const found = rawList.find(m => m.month === i + 1);
            return {
                month: (i + 1) + '月',
                activityCount: found ? found.activityCount : 0,
                participantCount: found ? found.participantCount : 0
            };
        });

        trendChartInstance.setOption({
            tooltip: {
                trigger: 'axis',
                backgroundColor: '#fff',
                borderColor: '#e5e7eb',
                borderRadius: 8,
                textStyle: { color: '#374151', fontSize: 13 }
            },
            legend: {
                bottom: 0,
                textStyle: { color: '#6b7280', fontSize: 12 }
            },
            grid: { left: 40, right: 20, top: 16, bottom: 50, containLabel: true },
            xAxis: {
                type: 'category',
                data: monthData.map(m => m.month),
                axisLabel: { fontSize: 12, color: '#6b7280' },
                axisLine: { lineStyle: { color: '#e5e7eb' } },
                boundaryGap: false
            },
            yAxis: {
                type: 'value',
                axisLabel: { fontSize: 12, color: '#6b7280' },
                splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } }
            },
            series: [
                {
                    name: '活动数量',
                    type: 'line',
                    data: monthData.map(m => m.activityCount),
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    lineStyle: { width: 2, color: '#3b82f6' },
                    itemStyle: { color: '#3b82f6' }
                },
                {
                    name: '参与人数',
                    type: 'line',
                    data: monthData.map(m => m.participantCount),
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    lineStyle: { width: 2, color: '#8b5cf6' },
                    itemStyle: { color: '#8b5cf6' }
                }
            ]
        });
    }

    /* =========== 窗口 resize 自适应 =========== */
    window.addEventListener('resize', () => {
        if (heatChartInstance)  heatChartInstance.resize();
        if (trendChartInstance) trendChartInstance.resize();
    });
</script>
</body>
</html>
