<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动管理 - 志愿服务管理系统</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .page-title { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .toolbar-left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

        .filter-select {
            padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; color: var(--text-primary); background: #fff; cursor: pointer;
            outline: none; transition: border-color .15s;
        }
        .filter-select:focus { border-color: var(--primary); }

        .search-input-wrap { position: relative; }
        .search-input-wrap input {
            padding: 9px 14px 9px 36px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; width: 240px; outline: none;
            transition: border-color .15s;
        }
        .search-input-wrap input:focus { border-color: var(--primary); }
        .search-input-wrap .search-icon {
            position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); font-size: 14px;
        }

        /* 活动表格 */
        .activity-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
        .activity-table th {
            background: #f8fafc; padding: 13px 18px; text-align: left;
            font-size: 13px; font-weight: 600; color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }
        .activity-table td {
            padding: 14px 18px; font-size: 14px; color: var(--text-primary);
            border-bottom: 1px solid #f1f5f9; vertical-align: middle;
        }
        .activity-table tr:last-child td { border-bottom: none; }
        .activity-table tr:hover td { background: #f8fafc; }

        .act-title-cell .act-title { font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .act-title-cell .act-org { font-size: 12px; color: var(--text-secondary); }

        .category-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 500;
            background: var(--primary-light); color: var(--primary);
        }

        .quota-cell .quota-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .quota-bar { width: 80px; height: 4px; background: #e9ecef; border-radius: 2px; overflow: hidden; }
        .quota-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; }
        .quota-bar-fill.full { background: var(--success); }
        .quota-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }

        .ops-btns { display: flex; gap: 6px; align-items: center; }
        .btn-icon {
            width: 32px; height: 32px; border-radius: 8px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; transition: background .15s;
        }
        .btn-icon.view   { background: var(--primary-light); color: var(--primary); }
        .btn-icon.view:hover   { background: #dbeafe; }
        .btn-icon.edit   { background: var(--success-bg); color: var(--success); }
        .btn-icon.edit:hover   { background: #bbf7d0; }
        .btn-icon.delete { background: var(--danger-bg); color: var(--danger); }
        .btn-icon.delete:hover { background: #fecaca; }

        .total-hint { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .empty-state { text-align: center; padding: 60px 0; color: var(--text-secondary); font-size: 14px; }
    </style>
</head>
<body>

<div class="admin-body">
    <div class="page-header">
        <div>
            <div class="page-title">活动管理</div>
            <div class="page-subtitle">管理所有志愿活动</div>
        </div>
        <button class="btn btn-primary" onclick="location.href='activity-form.html'" style="padding:10px 22px;font-size:14px">＋ 发布新活动</button>
    </div>

        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="keyword" placeholder="搜索活动名称...">
                </div>
                <select class="filter-select" id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="0">草稿</option>
                    <option value="1">报名中</option>
                    <option value="2">进行中</option>
                    <option value="3">已结束</option>
                    <option value="4">已取消</option>
                </select>
            </div>
        </div>

        <p class="total-hint" id="totalHint">加载中...</p>

        <table class="activity-table" id="activityTable">
            <thead>
                <tr>
                    <th>活动名称</th>
                    <th>类别</th>
                    <th>状态</th>
                    <th>时间</th>
                    <th>报名情况</th>
                    <th>地点</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" class="empty-state">加载中...</td></tr>
            </tbody>
        </table>

        <div class="pagination" id="pagination" style="margin-top:20px;"></div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
    requireAuth(1);
    renderNavbar('admin');
    renderSidebar('activities');

    let pageNum = 1;
    const pageSize = 10;

    document.getElementById('keyword').addEventListener('input', debounce(() => { pageNum = 1; load(); }, 400));
    document.getElementById('statusFilter').addEventListener('change', () => { pageNum = 1; load(); });

    async function load() {
        const keyword = document.getElementById('keyword').value.trim();
        const status  = document.getElementById('statusFilter').value;
        const params  = { pageNum, pageSize };
        if (keyword) params.keyword = keyword;
        if (status !== '') params.status = Number(status);

        try {
            const data = await get('/api/activities', params);
            document.getElementById('totalHint').textContent = `找到 ${data.total} 条活动记录`;
            renderTable(data.list || []);
            renderPagination(document.getElementById('pagination'), data.total, pageNum, pageSize, p => {
                pageNum = p; load();
            });
        } catch (e) {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="empty-state">加载失败，请稍后重试</td></tr>`;
        }
    }

    function getCategoryLabel(title, desc) {
        const text = title + (desc || '');
        if (/环境|清洁|环保|植树/.test(text)) return '环境保护';
        if (/敬老|老人|助残|陪伴|孤寡/.test(text)) return '敬老助残';
        if (/教育|辅导|图书|阅读|课业|支教/.test(text)) return '教育辅导';
        if (/医疗|救护|健康|义诊/.test(text)) return '医疗救护';
        if (/文化|宣传|演出|艺术/.test(text)) return '文化宣传';
        if (/应急|救援|防灾|交通|安全/.test(text)) return '文化宣传';
        return '志愿服务';
    }

    function renderTable(list) {
        const tbody = document.getElementById('tableBody');
        if (list.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty-state">暂无活动数据</td></tr>`;
            return;
        }
        tbody.innerHTML = list.map(a => {
            const st = activityStatusInfo(a.status);
            const category = getCategoryLabel(a.title, a.description);
            const dateStr = formatDate(a.startTime) + (a.endTime && a.endTime !== a.startTime ? '<br>至 ' + formatDate(a.endTime) : '');
            const signed = a.signedCount || 0;
            const quota  = a.totalQuota  || 0;
            const pct    = quota > 0 ? Math.min(100, Math.round(signed / quota * 100)) : 0;
            const isFull = quota > 0 && signed >= quota;

            return `<tr>
                <td class="act-title-cell">
                    <div class="act-title">${escapeHtml(a.title)}</div>
                    <div class="act-org">${escapeHtml(a.organizer || '')}</div>
                </td>
                <td><span class="category-badge">${escapeHtml(category)}</span></td>
                <td><span class="badge ${st.cls}">${st.text}</span></td>
                <td style="font-size:13px;color:var(--text-secondary)">${dateStr}</td>
                <td class="quota-cell">
                    <div class="quota-bar-wrap">
                        <span style="font-size:13px;font-weight:600;white-space:nowrap">${signed}/${quota}</span>
                        <div class="quota-bar">
                            <div class="quota-bar-fill ${isFull ? 'full' : ''}" style="width:${pct}%"></div>
                        </div>
                        <span class="quota-text">${pct}%</span>
                    </div>
                </td>
                <td style="font-size:13px;color:var(--text-secondary)">${escapeHtml(a.location || '—')}</td>
                <td>
                    <div class="ops-btns">
                        <button class="btn-icon view" title="查看" onclick="location.href='../activity-detail.html?id=${a.id}'">👁</button>
                        <button class="btn-icon edit" title="编辑" onclick="location.href='activity-form.html?id=${a.id}'">✏</button>
                        <button class="btn-icon delete" title="删除" onclick="deleteActivity(${a.id}, '${escapeHtml(a.title)}')">🗑</button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    async function deleteActivity(id, title) {
        const ok = await showConfirm('确认删除', `确定要删除活动「${title}」吗？此操作不可恢复。`);
        if (!ok) return;
        try {
            await del(`/api/activities/${id}`);
            showToast('删除成功', 'success');
            load();
        } catch (e) { /* showToast already called */ }
    }

    function debounce(fn, delay) {
        let timer;
        return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
    }

    load();
</script>
</body>
</html>
