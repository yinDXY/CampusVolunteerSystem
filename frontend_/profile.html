<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 志愿服务管理系统</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        .profile-container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); text-decoration: none; margin-bottom: 20px; font-size: 14px; }
        .back-link:hover { color: var(--primary); }

        .profile-grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }

        /* 用户信息卡片 */
        .user-card { background: #fff; border-radius: 12px; padding: 32px 24px; box-shadow: var(--shadow); text-align: center; }
        .avatar-circle { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #818cf8, #a78bfa); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #fff; font-weight: 600; }
        .user-card .name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .user-card .username { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
        .user-card .info-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-primary); margin: 8px 0; justify-content: flex-start; padding-left: 24px; }
        .user-card .info-row .icon { font-size: 16px; color: var(--primary); width: 20px; text-align: center; }
        .skill-section { margin-top: 20px; text-align: left; padding-left: 24px; }
        .skill-section .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag { background: #eff6ff; color: var(--primary); padding: 4px 12px; border-radius: 12px; font-size: 13px; }

        /* 雷达图卡片 */
        .radar-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
        .radar-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .radar-card img { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        .radar-placeholder { text-align: center; color: var(--text-secondary); padding: 60px 0; }

        /* 勋章墙 */
        .badge-wall-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-top: 24px; }
        .badge-wall-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .badge-wall { display: flex; flex-wrap: wrap; gap: 24px; }
        .badge-item { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; }
        .badge-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .badge-icon.unlocked { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; }
        .badge-icon.locked { background: #e2e8f0; color: #94a3b8; filter: grayscale(1); }
        .badge-name { font-size: 12px; color: var(--text-primary); text-align: center; }

        /* 报名记录 */
        .records-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: var(--shadow); margin-top: 24px; }
        .records-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
        .record-item { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
        .record-item .rec-left { flex: 1; }
        .record-item .rec-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .record-item .rec-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .record-item .rec-date { font-size: 13px; color: var(--text-secondary); }
        .record-item .score-row { margin-top: 8px; font-size: 13px; color: #f59e0b; }

        @media(max-width:768px) {
            .profile-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <a href="activity-list.html" class="back-link">‹ 返回</a>
        <div class="profile-grid" id="profileGrid">
            <div id="leftCol"><div class="spinner"></div></div>
            <div id="rightCol"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
        renderNavbar('profile');

        let profile = null;
        let achievements = [];
        let records = [];

        async function loadProfile() {
            try {
                const [profileData, achData, regData] = await Promise.all([
                    get('/api/profile/radar'),
                    get('/api/achievements'),
                    get('/api/registrations/my', { pageNum: 1, pageSize: 50 })
                ]);
                profile = profileData;
                achievements = achData || [];
                records = (regData.list || []);
                render();
            } catch (err) {
                document.getElementById('leftCol').innerHTML = '<p style="color:var(--text-secondary)">加载失败，请稍后重试</p>';
            }
        }

        function render() {
            const nameInitial = (profile.realName || 'U').charAt(0);
            const tags = profile.skillTags ? profile.skillTags.split(',').filter(Boolean) : [];

            // Left column: user card + badge wall
            let leftHtml = `
            <div class="user-card">
                <div class="avatar-circle">${escapeHtml(nameInitial)}</div>
                <div class="name">${escapeHtml(profile.realName || '')}</div>
                <div class="username">@${escapeHtml(getUsername())}</div>
                <div class="info-row"><span class="icon">✉</span> ${escapeHtml(profile.email || '未设置')}</div>
                <div class="info-row"><span class="icon">📞</span> ${escapeHtml(profile.phone || '未设置')}</div>
                <div class="info-row"><span class="icon">🕐</span> 累计服务 ${profile.totalHours || 0} 小时</div>
                ${tags.length > 0 ? `
                <div class="skill-section">
                    <div class="label">擅长领域</div>
                    <div class="skill-tags">${tags.map(t => `<span class="skill-tag">${escapeHtml(t)}</span>`).join('')}</div>
                </div>` : ''}
            </div>`;

            // Badge wall
            leftHtml += `
            <div class="badge-wall-card">
                <h3>🏅 勋章墙</h3>
                <div class="badge-wall">
                    ${achievements.length === 0 ? '<p style="color:var(--text-secondary);font-size:14px">暂无勋章数据</p>' :
                    achievements.map(a => `
                        <div class="badge-item" title="${escapeHtml(a.description || '')}">
                            <div class="badge-icon ${a.unlocked ? 'unlocked' : 'locked'}">★</div>
                            <span class="badge-name">${escapeHtml(a.name)}</span>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            document.getElementById('leftCol').innerHTML = leftHtml;

            // Right column: radar chart + registration records
            let rightHtml = `
            <div class="radar-card">
                <h3>能力雷达图</h3>
                ${profile.radarImageBase64
                    ? `<img src="${profile.radarImageBase64}" alt="能力雷达图">`
                    : '<div class="radar-placeholder">雷达图服务暂不可用<br><small>维度：累计时长(h) · 活动次数 · 类型多样性 · 平均评分 · 准时率(%)</small></div>'}
            </div>`;

            // Records
            rightHtml += `
            <div class="records-card">
                <h3>我的报名记录</h3>
                ${records.length === 0 ? '<p style="color:var(--text-secondary);font-size:14px">暂无报名记录</p>' :
                records.map(r => {
                    const st = registrationStatusInfo(r.status);
                    let scoreHtml = '';
                    if (r.score != null) {
                        scoreHtml = `<div class="score-row">⭐ 评分：${r.score} 分${r.remark ? '　' + escapeHtml(r.remark) : ''}</div>`;
                    }
                    return `
                    <div class="record-item">
                        <div class="rec-left">
                            <div class="rec-title">${escapeHtml(r.positionName || r.activityTitle || '未知岗位')}</div>
                            <div class="rec-sub">${escapeHtml(r.activityTitle || '')}</div>
                            <div class="rec-date">📅 ${formatTime(r.createdAt)}</div>
                            ${scoreHtml}
                        </div>
                        <span class="badge ${st.cls}">${st.text}</span>
                    </div>`;
                }).join('')}
            </div>`;

            document.getElementById('rightCol').innerHTML = rightHtml;
        }

        loadProfile();
    </script>
</body>
</html>
